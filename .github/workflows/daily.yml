name: 毎朝ブリーフィング自動生成

on:
  schedule:
    - cron: '30 0 * * 1-5'  # 毎週月〜金 9:30 JST (UTC 0:30)
  workflow_dispatch:          # 手動実行ボタン

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 依存パッケージをインストール
        run: |
          pip install \
            google-api-python-client \
            google-auth \
            google-auth-httplib2 \
            playwright

      - name: Playwright ブラウザをインストール
        run: playwright install chromium --with-deps

      - name: 最新コードを取得
        run: git pull --rebase origin master

      - name: 日付を環境変数にセット
        run: echo "TODAY=$(TZ=Asia/Tokyo date '+%Y-%m-%d')" >> $GITHUB_ENV

      - name: ブリーフィングページを生成
        env:
          GOOGLE_TOKEN:      ${{ secrets.GOOGLE_TOKEN }}
          CALENDAR_ID:       ${{ secrets.CALENDAR_ID }}
          GIJIROKU_EMAIL:    ${{ secrets.GIJIROKU_EMAIL }}
          GIJIROKU_PASSWORD: ${{ secrets.GIJIROKU_PASSWORD }}
          LSTEP_EMAIL:       ${{ secrets.LSTEP_EMAIL }}
          LSTEP_PASSWORD:    ${{ secrets.LSTEP_PASSWORD }}
        run: python generate_briefing.py

      - name: GitHub Pages にプッシュ
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📅 ブリーフィング自動更新 ${{ env.TODAY }}"
          file_pattern: "*.html"
