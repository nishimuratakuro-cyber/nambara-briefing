name: 毎朝ブリーフィング自動生成

on:
  schedule:
    - cron: '30 0 * * 1-5'   # 毎週月〜金  9:30 JST (UTC 0:30) 朝実行
    - cron: '0 9 * * 1-5'    # 毎週月〜金 18:00 JST (UTC 9:00) 夕方再実行（当日議事録を更新）
  workflow_dispatch:           # 手動実行ボタン

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v6.0.2

      - name: Python セットアップ
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'

      - name: 依存パッケージをインストール
        run: |
          pip install \
            google-api-python-client \
            google-auth \
            google-auth-httplib2 \
            playwright

      - name: Playwright ブラウザをインストール
        run: playwright install chromium --with-deps

      - name: 日付を環境変数にセット
        run: echo "TODAY=$(TZ=Asia/Tokyo date '+%Y-%m-%d')" >> $GITHUB_ENV

      - name: 古いHTMLファイルを削除（30日以上前）
        run: |
          find . -maxdepth 1 -name "20[0-9][0-9]-[0-9][0-9]-[0-9][0-9].html" | while read f; do
            fname=$(basename "$f" .html)
            if [ "$(date -d "$fname" +%s 2>/dev/null)" -lt "$(date -d "30 days ago" +%s)" ]; then
              echo "削除: $f"
              rm "$f"
            fi
          done

      - name: ブリーフィングページを生成
        env:
          GOOGLE_TOKEN:      ${{ secrets.GOOGLE_TOKEN }}
          CALENDAR_ID:       ${{ secrets.CALENDAR_ID }}
          GIJIROKU_EMAIL:    ${{ secrets.GIJIROKU_EMAIL }}
          GIJIROKU_PASSWORD: ${{ secrets.GIJIROKU_PASSWORD }}
          LSTEP_EMAIL:       ${{ secrets.LSTEP_EMAIL }}
          LSTEP_PASSWORD:    ${{ secrets.LSTEP_PASSWORD }}
        run: python generate_briefing.py

      - name: Lステップ ログインデバッグ画像をアップロード
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lstep-login-debug
          path: lstep_login_debug.png
          if-no-files-found: ignore
          retention-days: 7

      - name: GitHub Pages にプッシュ
        uses: stefanzweifel/git-auto-commit-action@v7.1.0
        with:
          commit_message: "📅 ブリーフィング自動更新 ${{ env.TODAY }}"
          file_pattern: "*.html"
